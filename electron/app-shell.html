<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Communication Hub</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#111844}.bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;border-bottom:1px solid #e5e8ee;background:#fff;box-shadow:0 3px 12px rgba(17,24,68,.08);-webkit-app-region:drag}.title{display:flex;align-items:center;gap:8px;min-width:0}.dot{width:8px;height:8px;border-radius:50%;background:#7288ae}.title span:last-child{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:4px;-webkit-app-region:no-drag}.controls button{width:30px;height:28px;border:0;border-radius:8px;background:#f0f2f5;color:#687284;cursor:pointer}.controls button:hover{background:#e8ebf0;color:#111844}.controls .close:hover{background:#faeeee;color:#a33}</style></head><body><div class="bar"><div class="title"><span class="dot"></span><span id="title">Communication Hub</span></div><div class="controls"><button id="reload" title="Reload">↻</button><button id="minimize" title="Minimize">—</button><button id="close" class="close" title="Close">×</button></div></div><script>const p=new URLSearchParams(location.search);document.getElementById('title').textContent=p.get('name')||'Communication Hub';document.getElementById('reload').onclick=()=>window.appWindow.reload();document.getElementById('minimize').onclick=()=>window.appWindow.minimize();document.getElementById('close').onclick=()=>window.appWindow.close();</script></body></html>
